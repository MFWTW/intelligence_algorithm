task_parser:
  ros__parameters:
    # Bare file name on purpose: the binary ships in the workspace root, so
    # task_parser.py searches for it against $MYBOT_WS, the workspace this
    # package was installed from, the working directory and finally ~/dev_ws.
    # An absolute path here works too, but it only exists on the machine that
    # wrote it - which is exactly what broke on a fresh clone before 2026-10-13.
    generator_path: TMSCQtest_x86_x64.bin
    generator_timeout_sec: 10.0
    problem_override: ''
    api_key_env: DEEPSEEK_API_KEY
    api_key_file: ''
    api_base_url: https://api.deepseek.com/chat/completions
    model: deepseek-chat
    temperature: 0.0
    max_tokens: 400
    request_timeout_sec: 40.0
    max_retries: 4
    retry_backoff_sec: 1.5
    fallback_model: deepseek-reasoner
    mapping_rules: "1. 题面中“每个<容器>有N个<物品>”表示一个容器可装 N 件物品，填入 capacity。\n2. 你只做信息抽取：把题面里每个人需要的数量逐行列出，不要自己做求和、\n\
      \   不要自己做除法、不要输出总数。\n3. first 表示题面中先出现的物品类别，second 表示后出现的物品类别。\n   例：T恤、裤子 ->\
      \ first=T恤，second=裤子。\n4. “甲、乙都需要N个X”必须拆成两行（甲一行、乙一行），每行都是 N，\n   顿号里有几个人就写几行。\n\
      5. 不要做颜色或区域的判断。\n"
    system_prompt: '你是机器人比赛的任务解析器。请严格按照下面的规则，把中文应用题解析成 JSON。

      只输出 JSON 对象，不要输出任何其他内容。

      '
    output_schema: '{"capacity":<int>,"items":[{"who":"<人名>","first":<int>,"second":<int>}]}'
    color_x: red
    color_y: blue
    zone_by_count:
    - C
    - C
    - A
    - A
    zone_rule_text: x 代表红色，y 代表蓝色；数值大于等于 3 的去 A 区，其他颜色去 C 区
    enforce_count_invariant: true
    min_count_per_color: 1
    expected_total_counts: 5
    max_cubes_per_color: 5
    mapping_rule: 1
    red_min_count: 3
    zone_x: B
    zone_y: A
    zone_blue: B
    zone_red: C
    competition_mode: true
