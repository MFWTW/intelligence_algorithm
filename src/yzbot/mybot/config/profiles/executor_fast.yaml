    # blue_cube_3 -> A: the old straight approach to (12.875,-3.875)
    # crossed mover_3's (11.76,-4.53)<->(12.62,-5.87) patrol lane.
    # In the 2026-10-14 GUI round it wedged at (11.6,-5.5), spending 105 s
    # in NAV_TO_ZONE before failing with the cube attached. The static map has
    # a wall at y~-3.7 ending near x=12.7, so a north-side shortcut is NOT safe.
    # Stage outside the patrol band to the south, pass its east end, then cross
    # to the north side east of the wall. The existing yield policy can stop at
    # the first waypoint without parking on the moving box's path. Keep the
    # loaded footprint unchanged; these points are a route trial, not proof of
    # collision-free driving (Nav2 still checks live costmaps).
