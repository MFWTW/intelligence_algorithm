fixed_joint_pick_place:
  ros__parameters:
    # Every node in this Gazebo stack runs on simulation time, and the executor
    # must too. It is spawned by task_state_machine.py, NOT by the launch file,
    # so nothing else sets this for it. Left false, its one clock comparison
    # (scan age) read 1.79e9 s and the whole obstacle-yield policy exited on
    # "stale scan" every tick - silently, for a complete round (2026-10-13).
    # It also stamps its NavigateToPose goals from this clock.
    use_sim_time: true
    # Predictive yielding to the patrol boxes is ON for the competition profile
    # (decided by the operator 2026-10-13, after the layer was made to work):
    # without it the base drives until RPP refuses, ends up 0.36 m from a
    # kinematic box that never yields, and gets flung
    # (ROBOT_LAUNCHED 3.7 m/s, /tmp/mybot_start_lATL.log).
    # Verified 2026-10-13 in run_logs/yield_diag_denoised_20261013-181609:
    # 39 decisions, 28 of them within 0.35 m of a real mover.
    enable_obstacle_yield: true
    # Pinned here on purpose: this profile is the deployment contract, so a
    # change to a script default must not silently retune a scored round.
    yield_clear_margin_sec: 0.3
    yield_max_mover_speed_mps: 0.6
    yield_wait_budget_sec: 20.0
    cube_name: red_cube_1
    warehouse: A
    navigation_frame: map
