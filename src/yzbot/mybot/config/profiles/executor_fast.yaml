    - 4.0
    - -3.141593
    pickup_blue_cube_5_pose:
    - -2.988
    - -11.583
    - -3.141593
    use_backup_pickup_pose: true
    pickup_backup_offset_m: 0.15
    enable_visual_handoff: true
    visual_handoff_distance_m: 1.4
    visual_handoff_min_distance_m: 0.85
    # 停稳后低于这个距离先退避：相机行先验在 ~0.45 m 内会跑出画面，
    # 探测器会把所有轮廓拒掉，表现成 "Visual blob lost" + 75 s 超时。
    visual_handoff_coast_min_distance_m: 0.45
    warehouse_a_pose:
    - 7.244
    - -2.483
    - -3.141593
    warehouse_b_pose:
    - -7.321
    - -3.018
    - -3.141593
    warehouse_c_pose:
    - 0.016
    - -2.702
    - -1.570796
    # OFF. Tried ON for the 2026-10-13 throughput pass and reverted the same
    # evening: with the aligned approach the C-zone round looped on the approach
    # goal 47 times and failed at 0/5, and an earlier attempt at 1/5 was flung.
    # The idea is sound (it removes the in-place rotation at the goal) but the
    # approach poses were never validated per zone - re-enable only with a
    # per-zone validation round.
    use_aligned_warehouse_approach: false
    # Send each delivery's detour points plus the plate as ONE
    # NavigateThroughPoses goal. Measured 2026-10-14: with a goal per waypoint
    # the operator watched the base "ignore the route", because every leg was
    # cancelled and re-planned from wherever the yield hold left it (11 planned
    # goals produced 38 goal cancellations in one round). One goal = one plan
    # for the whole polyline, and the yield resume re-sends that same goal.
    # Set false to go back to the per-waypoint walk.
    use_continuous_detour: true
    chain_switch_radius_m: 0.75
    warehouse_a_approach_pose:
    - 10.244
    - -2.483
    - -3.141593
    warehouse_b_approach_pose:
    - -4.321
    - -3.018
    - -3.141593
    warehouse_c_approach_pose:
    - 0.016
    - 0.298
    - -1.570796
    blue_cube_1_pickup_via_1:
    - -2.3
    - 0.0
    - 3.141593
    blue_cube_1_pickup_via_2:
    - -4.2
    - 0.0
    - 3.141593
    red_cube_2_pickup_via_1: []
    blue_cube_1_warehouse_b_via_1:
    - -7.321
    - -3.018
    - -3.141593
    blue_cube_1_warehouse_b_via_2:
    - -7.321
    - -3.018
    - -3.141593
    blue_cube_1_warehouse_c_via_1:
    - 0.016
    - -2.702
    - -1.570796
    blue_cube_1_warehouse_c_via_2:
    - 0.016
    - -2.702
    - -1.570796
    # Red cube 1 -> C: Nav2 chooses the route; no fixed intermediate points.
    red_cube_1_warehouse_c_via_1: []
    red_cube_1_warehouse_c_via_2: []
    # Blue cube 3 -> A: no mandatory intermediate points; Nav2 chooses the
    # route around walls and moving obstacles using the loaded costmaps.
    blue_cube_3_warehouse_a_via_1: []
    blue_cube_3_warehouse_a_via_2: []
    blue_cube_3_warehouse_a_via_3: []
    robot_model_name: six_arm
    robot_base_link: base_footprint
    empty_robot_radius_m: 0.32
    empty_inflation_radius_m: 0.55
    # 全局规划额外余量：0.0 时 NavFn 会贴着车体半径（内切带 253）走，RPP 的
    # 前向投影弧随即拒绝，表现为墙角静止 18 s + 后退重试。受控试验量化后取 0.10。
    global_radius_margin_m: 0.10
    loaded_robot_radius_m: 0.35
    loaded_inflation_radius_m: 0.6
    robot_attach_link: link6
    cube_link: link
    require_system_ready: true
    ready_timeout_sec: 180.0
    action_timeout_sec: 30.0
    navigation_timeout_sec: 300.0
    navigation_accept_radius_m: 0.22
    navigation_accept_yaw_rad: 0.79
    navigation_accept_hold_sec: 1.0
    enable_dock_creep: true
    # 2026-11-16: Nav2 hands the base over at full speed, and from 1.5 m/s
    # it coasts ~0.45 m before the smoother's 2.5 m/s^2 ramp stops it. At
    # 0.35 m the creep therefore started past the plate and had to swing
    # 168 deg back (competition_lanes_v02h trace). Hand over at 0.8 m so
    # the coast lands short of the plate.
    dock_creep_trigger_m: 0.8
    dock_creep_speed_mps: 0.15
    dock_creep_forward_gain: 0.8
    dock_creep_tolerance_m: 0.03
    dock_creep_yaw_tolerance_rad: 0.06
    dock_creep_timeout_sec: 26.0
    # 2026-11-16: 0.22 was the hole that lost the slot - two warehouse A docks in
    # a row were accepted at 0.210 m and the released cube landed 0.153 m off in
    # y, outside the +/-0.235 slot box. 0.06 turned out to be unreachable (the
    # creep hunted for its whole 26 s budget at 0.089-0.143 m and the leg died),
    # so 0.10 is the value the base can actually deliver: 0.10 + slot 0.12 +
    # bias 0.02 = 0.24, inside 0.235 with the heading error now compensated in
    # joint1 instead of being inherited by the drop.
    dock_creep_accept_m: 0.10
    # 2026-11-16: the place posture is a fixed set of joint angles, so the drop
    # sits a fixed leash (~0.36 m) from the base and inherits its heading. joint1
    # is the arm's vertical axis, so rotating it by the dock heading error puts
    # the drop back on the plate's y axis. Limit 0.6 rad = 34 deg.
    place_yaw_compensation: true
    place_yaw_comp_limit_rad: 0.6
    # Two windows: a refused creep costs one nav retry (~10 s), a misplaced cube
    # costs the round.
    dock_creep_attempts: 2
    dock_creep_align_distance_m: 0.25
    escape_distance_m: 0.7
    # 2026-11-17 A/B 结论：把无进展判据压到 25 s 并把重试预算压到 1，两轮 rule1
    # 全部 FAILED（abaz1 2/5、abaz2 0/5）——它砍掉的是“控制器零指令 45 s 后靠逃逸
    # 重试救回来”的那条路，而不是纯粹浪费的尾巴。故保持 45 s 与 retry=2 不变。
    # 若要快速放弃，应判“规划器连续 N 次失败（目标不可达）”，不要用原始静止计时。
    navigation_retry_count: 2
    action_retry_count: 2
    service_timeout_sec: 20.0
    link_service_attempts: 2
    # Pause the world for the ATTACH/DETACH call. The attacher mutates
    # joints from a ROS callback thread while ODE keeps stepping, and
    # every recorded gzserver SIGSEGV (4 runs, 2026-10-08 .. 2026-11-15)
    # lands ~0.5 s after DETACH during VERIFY_PLACE. The pause is capped
    # by physics_freeze_timeout_sec so a wedged service cannot freeze the
    # simulation.
    freeze_physics_around_link_services: true
    physics_freeze_timeout_sec: 2.0
    dependency_timeout_sec: 60.0
    enable_visual_alignment: true
    camera_topic: /camera/image_raw
    fine_cmd_vel_topic: /cmd_vel_nav
