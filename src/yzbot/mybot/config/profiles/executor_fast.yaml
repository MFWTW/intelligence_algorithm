fixed_joint_pick_place:
  ros__parameters:
    # Every node in this Gazebo stack runs on simulation time, and the executor
    # must too. It is spawned by task_state_machine.py, NOT by the launch file,
    # so nothing else sets this for it. Left false, its one clock comparison
    # (scan age) read 1.79e9 s and the whole obstacle-yield policy exited on
    # "stale scan" every tick - silently, for a complete round (2026-10-13).
    # It also stamps its NavigateToPose goals from this clock.
    use_sim_time: true
    # Predictive yielding to the patrol boxes is ON for the competition profile
    # (decided by the operator 2026-10-13, after the layer was made to work):
    # without it the base drives until RPP refuses, ends up 0.36 m from a
    # kinematic box that never yields, and gets flung
    # (ROBOT_LAUNCHED 3.7 m/s, /tmp/mybot_start_lATL.log).
    # Verified 2026-10-13 in run_logs/yield_diag_denoised_20261013-181609:
    # 39 decisions, 28 of them within 0.35 m of a real mover.
    enable_obstacle_yield: true
    # Pinned here on purpose: this profile is the deployment contract, so a
    # change to a script default must not silently retune a scored round.
    yield_clear_margin_sec: 0.3
    # Detect the 0.08 m/s patrols but exclude measured 0.86+ m/s phantom tracks.
    yield_max_mover_speed_mps: 0.6
    yield_wait_budget_sec: 20.0
    # Pinned for the same reason as the three above. These decide where a hold
    # is allowed to park and when it may end, measured against mover_3 on
    # 2026-11-15: at 0.5 m the base held 0.72 m from the box, the box still
    # swept through it to 0.32 m, and the hold/resume pair flipped ~1 Hz for
    # 20 s. See obstacle_yield.YieldConfig for the full note.
    yield_lane_hold_clearance_m: 0.62
    yield_lane_escape_delay_sec: 1.0
    yield_hold_release_margin_m: 0.12
    yield_clear_hold_sec: 0.5
    # Keep the episode latch (not the hold) through the base's restart, so a
    # release is judged at the resume speed rather than at 0.05 m/s.
    yield_go_commit_sec: 0.8
    yield_go_commit_m: 0.40
    # A lateral exit is a Nav2 goal: reject it locally if the target cell is
    # already inside the global costmap's inscribed band.
    yield_arc_costmap_check: true
    # The apex can be outside that band while the floor between the base and
    # that cell is not. On 2026-11-21 (block 4, red_cube_1 -> A) the arc target
    # was clear but the carried 0.35 m envelope could not cross the 0.55 m gap:
    # 0.94 m driven in 14.8 s, controller status 6, and the leg failed with the
    # cube attached. Vet every cell the sidestep would cross.
    yield_arc_path_check: true
    yield_arc_path_start_m: 0.20
    yield_arc_path_step_m: 0.10
    # One lateral waypoint is <= ~1 m. Abandon it in seconds, not one 45 s leg
    # watchdog: measured 0.70 m in 36.9 s before that round died. The total cap
    # also rejects a slow creep that never quite stops.
    yield_arc_progress_timeout_sec: 8.0
    yield_arc_progress_m: 0.10
    yield_arc_timeout_sec: 20.0
    # After a refused/failed sidestep, hold briefly and retry the original
    # route. A failed convenience arc must not make the carried leg terminal.
    yield_arc_recovery_hold_sec: 1.0
    # Go round a crossing box instead of parking for it. Movers patrol at
    # 0.20 m/s, so a hold that waits for one to clear spent 26.75 s / 31.83 s /
    # 42.02 s in single episodes across the 2026-11-18 rounds while the floor
    # beside the base was empty. The detour is the same lateral waypoint
    # `yield_arc_costmap_check` already vets, taken before the budget is spent
    # rather than after it; a head-on box (closing faster than the value below)
    # and anything inside the 0.75 m keep-out still stop.
    yield_early_detour: true
    # Only detour when driving on would need at least this long to clear the
    # conflict - if the base clears sooner, driving on is already the answer.
    yield_early_detour_lead_sec: 0.6
    # A box closing on the base faster than this is not crossing it.
    yield_early_detour_head_on_mps: 0.05
    # Decide further out than the 1.8 m cap range: the offset needs ~0.9 m of
    # floor beside the path, and that room usually only exists further back
    # (detour1: the 11.3 s hold had 0.48 m of side room at 1.7 m range).
    yield_early_detour_range_m: 3.0
    # Predicted occupancy: at each future tick, compare the base's candidate
    # path against the mover's predicted path (both as oriented boxes). A stop
    # order cannot stop a box that sweeps the stop point (r53 rule 2, t=28.6 s:
    # 0.24 m centre distance while the hold point was inside the sweep), so the
    # candidates are compared in time and space instead of by distance alone.
    yield_predict_enabled: true
    yield_predict_range_m: 4.0
    yield_predict_horizon_sec: 4.0
    # Clearance that counts as "will not touch": 0.0 is contact, and 0.15 m is
    # the margin the tracker and the braking curve cannot promise away.
    yield_predict_clearance_m: 0.15
    # The patrol footprints (/movers/obstacles, base_link) are the only way the
    # yield layer sees a box the lidar cannot: measured detour1/detour2, the box
    # behind an 11.3 s standstill was first seen by the laser at 1.7 m, already
    # inside the choke, while the footprints are in view from 6 m. Used only as a
    # yield observation (never as a costmap source), so the plan-failure storms
    # that came from putting movers in the global costmap cannot return.
    yield_mover_cloud_stage: true
    yield_mover_cloud_range_m: 6.0
    yield_mover_cloud_band_m: 1.2
    yield_mover_cloud_timeout_sec: 0.35
