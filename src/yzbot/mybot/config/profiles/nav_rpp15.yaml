amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 30.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: false
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 50
    default_server_timeout: 200
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator/NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator/NavigateThroughPosesNavigator
    # The tuned recovery tree ships in this package (config/nav_to_pose_short_recovery.xml).
    # Never put a path here: an absolute one only exists on the machine it was written
    # on, and Nav2 does not expand $HOME or resolve a bare relative name predictably.
    # nav_bringup_gazebo2.launch.py injects the path that is correct on the running
    # machine (RewrittenYaml over the mybot share directory). Empty here means Nav2's
    # stock recovery tree - the same graceful fallback, never a failure to configure.
    default_nav_to_pose_bt_xml: ''
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    # 25 s was set when a yield hold left Nav2's goal ACTIVE, so the controller
    # had to be prevented from failing (and running the recovery's BackUp/Spin)
    # while the base waited for a box. The hold now CANCELS the goal instead, so
    # the controller is not following a path while waiting and a long tolerance
    # buys nothing - it only delays the retry/escape for a base that is really
    # stuck. Measured 2026-10-13 (run_logs/budget_fix_round): six refusal
    # episodes each burned the full 25 s before escaping; the round finished 5/5
    # but took 520 s against a 355 s baseline.
    failure_tolerance: 5.0
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      # Allow a bounded moving-obstacle hold without immediately triggering
      # Nav2's backup/spin recovery. The executor's separate 20 s wall-clock
      # wait budget still bounds each hold (clocks differ under simulation),
      # and the collision-refusal wedge detector remains active outside a hold.
      # See run_logs/yield_nav2_semantics.md for the progress checker semantics.
      # This profile change also affects navigation when yielding is disabled;
      # do not treat it as runtime safety validation.
      movement_time_allowance: 45.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.12
    FollowPath:
      # 2026-10-13 throughput pass (target: a 5-object round under 270 s).
      # Two attempted throughput passes REGRESSED (1.8 m/s with
      # cost_scaling_dist 0.25: 8 jam escapes and 3 x 25 s refusals; 1.6 m/s
      # with the approach floor raised: the goal was never satisfied and the
      # first delivery leg aborted 3/3). Both were reverted. What survives is
      # the narrow, measured step below: less unnecessary cost-regulated
      # crawling and a higher corner floor, with cruise, lookahead and the
      # end-of-leg ramp left exactly where the 355 s round had them.
      # Measured on run_logs/timed_round_20261013-214508: navigation was 232 s
      # of a 355 s task and 139 of those 231 s were spent BELOW 0.6 m/s - the
      # round was not limited by cruise speed but by three independent slow
      # floors stacking (cost-regulated scaling near inflation, curvature
      # scaling in every corner, and the end-of-leg approach ramp). Raising the
      # ceiling alone would have changed almost nothing.
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 1.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      # End-of-leg ramp: the old floor (0.05 m/s over the last 0.6 m) meant the
      # last stretch of every leg was a crawl. 0.30 m of ramp is still a gentle
      # arrival and the goal checker stops it anyway.
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      # 0.6 m of inflation cost slowed the base for most of the route; 0.25 m
      # keeps the caution where it matters (right beside geometry).
      cost_scaling_dist: 0.45
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      # Corners used to force 0.25 m/s. The tight passages keep their own
      # explicit caps (slow_zones) and the tight-passage pre-brake is unchanged,
      # so this floor can be raised without removing the protection.
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.4
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      allow_reversing: false
      transform_tolerance: 0.1
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.2
      plugins:
      - static_layer
      - voxel_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.36
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan movers
        scan:
          # Re-stamped by scan_relay.py: the raw /scan is ~10 ms ahead of the
          # newest odom->base_footprint, so the costmap could mark but never
          # clear (measured 2026-10-13: 99% of lookups extrapolated, 1128
          # phantom lethal cells, the base wedged by its own costmap).
          topic: /scan_stamped_now
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
        # The patrol boxes publish their own footprints on /movers/obstacles so
        # the base starts avoiding them before the lidar would see them (and
        # inside the 5 m local window at all). Measured 2026-10-13 with the
        # scan alone: the base drove at a box on its planned path and then
        # paced behind it. They are the base's right-of-way superiors, so they
        # must be in the costmap, not just in the laser. The cloud is in the
        # robot-centred base_link frame, NOT map: Nav2 uses the cloud's frame
        # origin to clear departed box marks. base_footprint is too close to
        # the voxel layer's z=0 lower boundary (a -0.00 m origin still fails);
        # base_link is 0.1034 m above the floor. A map-frame cloud yielded
        # 5244 out-of-bounds origin warnings in yield_trial_1.
        movers:
          topic: /movers/obstacles
          max_obstacle_height: 1.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: PointCloud2
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.2
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan movers
        scan:
          # Re-stamped by scan_relay.py: the raw /scan is ~10 ms ahead of the
          # newest odom->base_footprint, so the costmap could mark but never
          # clear (measured 2026-10-13: 99% of lookups extrapolated, 1128
          # phantom lethal cells, the base wedged by its own costmap).
          topic: /scan_stamped_now
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
        movers:
          topic: /movers/obstacles
          max_obstacle_height: 1.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: PointCloud2
          raytrace_max_range: 15.0
          raytrace_min_range: 0.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.36
      always_send_full_costmap: true
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 1.5
    - 0.0
    - 2.0
    min_velocity:
    - -0.8
    - 0.0
    - -2.0
    max_accel:
    - 2.5
    - 0.0
    - 3.2
    max_decel:
    - -2.5
    - 0.0
    - -3.2
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    # OBSERVER ONLY, and deliberately so. This stack's stock navigation launch
    # remaps the velocity smoother's output onto /cmd_vel, so /cmd_vel_smoothed
    # has ZERO publishers: the monitor used to read a topic nothing wrote and
    # could never see a command, while still holding a publisher on /cmd_vel.
    # Making it a real filter needs the canonical chain (smoother ->
    # /cmd_vel_smoothed -> monitor -> /cmd_vel), i.e. a custom navigation launch
    # plus its own validation round - not a silent remap. Until then it watches
    # the command the base actually follows and writes where nothing reads.
    cmd_vel_in_topic: cmd_vel
    cmd_vel_out_topic: cmd_vel_monitored
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - FootprintApproach
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      # The relayed sweep, not the raw one: the raw /scan is stamped ~10 ms
      # ahead of the newest odom->base_footprint, and this node's message filter
      # then drops frames and logs "Lookup would require extrapolation into the
      # future" - measured 2026-10-13, 81 such errors plus 64 dropped messages in
      # a single round. The costmaps were moved to the same topic for exactly
      # this reason; the monitor was left on the raw one.
      topic: scan_stamped_now
      min_height: 0.15
      max_height: 2.0
      enabled: true
docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins:
    - simple_charging_dock
    simple_charging_dock:
      plugin: opennav_docking/SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
