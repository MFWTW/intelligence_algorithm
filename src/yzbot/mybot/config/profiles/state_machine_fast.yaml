task_state_machine:
  ros__parameters:
    max_object_retries: 1
    # Measured 2026-10-14 15:34 (run_logs/chain_forensics_20261014-153453): the
    # base was trapped beside mover_2's patrol segment, the controller refused
    # the path 74-144 times per attempt and the base never moved 2 cm. With
    # skip_failed_object false the whole round ended at 1/5 while three cubes and
    # ~1800 s of budget remained; the same queue shape delivered 5/5 when that
    # object was not blocked. Skipping happens only AFTER the retry budget is
    # exhausted and only when the state is safe to retry: _unsafe_to_retry (cube
    # attached, unknown attachment) still fails the round closed, so no cube is
    # abandoned in an unknown state. Set false to go back to "one blocked cube
    # ends the round".
    skip_failed_object: true
    object_timeout_sec: 420.0
    task_timeout_sec: 0.0
    task_timeout_per_object_sec: 420.0
    task_startup_grace_sec: 180.0
    # 3.0 s was too tight for this host. Measured 2026-10-13
    # (run_logs/full_round_repro_20261013-203330): bt_navigator missed its
    # lifecycle bond heartbeat for 4 s under load, the manager declared it dead
    # and deactivated the managed nodes, the health gate went false, and 3 s
    # later the task aborted at 3/5 with the cube still in the gripper. The
    # stack rebuilt itself ~28 s later. Give a transient host hiccup room to
    # heal; the executor's own leg timeout (300 s) and per-object timeout still
    # bound a genuinely dead stack.
    health_loss_grace_sec: 45.0
    autostart: true
    allow_task_replay: true
    use_resident_executor: true
    select_nearest_cubes: true
    max_plausible_speed_mps: 3.0
    require_start_button: true
