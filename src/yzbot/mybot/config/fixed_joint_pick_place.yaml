    # stalls at the wall tip before the retry ladder backed off. This outer
    # route leaves B westwards, rounds the wall at y ~ -4.4 through the 1.5 m
    # gap at x ~ -12.9, and rejoins the goal from the west. Verified on
    # room_from_world.pgm: waypoint clearance 1.40 / 1.01 / 0.75 m and
    # 0.85 / 1.00 / 0.58 m straight-chord clearance. Driven at most once per
    # pickup, only after a failed attempt, and the last leg to the pickup pose
